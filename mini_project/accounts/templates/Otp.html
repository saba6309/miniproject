<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OTP</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }

      .page {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #333;
        transition: transform 0.8s ease, opacity 0.8s ease;
      }

      .form-container {
        width: 420px;
        height: 250px;
        background-color: #fff;
        border-radius: 15px;
        padding: 20px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        text-align: center;
        transition: transform 0.8s ease, opacity 0.8s ease;
      }

      .form-container h1 {
        font-size: 24px;
        margin-bottom: 60px;
        color: #333;
      }

      .form-field {
        margin-bottom: 35px;
      }

      .form-field input {
        width: 100%;
        padding: 8px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      .form-footer {
        display: flex;
        justify-content: space-between;
        margin-top: 50px;
      }

      .form-footer a {
        text-decoration: none;
        font-size: 14px;
        color: #333;
      }

      .form-footer a:hover {
        text-decoration: underline;
      }

      .go-back-btn {
        position: absolute;
        top: 40px;
        left: 330px;
        background: none;
        border: none;
        cursor: pointer;
      }

      .go-back-btn svg {
        width: 24px;
        height: 24px;
        fill: black;
      }

      .toggle-buttons {
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
      }

      .toggle-buttons button {
        width: 50%;
        padding: 10px;
        font-size: 16px;
        border: none;
        background-color: #007bff;
        color: #235e71;
        cursor: pointer;
        border-radius: 5px;
        transition: background-color 0.3s ease;
      }

      .toggle-buttons button:hover {
        background-color: #0056b3;
      }

      .toggle-buttons button.active {
        background-color: #333;
        color: #fff;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="form-container">
        <h1>Enter OTP</h1>
        <form method="post">
          {% csrf_token %} Enter your mail:
          <div class="form-field">
            <br />
            <input
              type="email"
              name="email"
              placeholder="Enter your email"
              required
            />
          </div>
          <button type="submit">Send OTP</button>
        </form>
      </div>
    </div>
  </body>
</html>
