<!DOCTYPE html>
<html lang="en">
  <head>
    {% load static %}
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Get Started</title>
    <link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon" />
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }

      .page {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #333;
      }

      .image-container {
        position: relative;
        width: 400px;
        height: 720px;
        overflow: hidden;
      }

      .background-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .button-overlay {
        position: absolute;
        bottom: 50px;
        left: 50%;
        transform: translateX(-50%);
      }

      .get-started-btn {
        background-color: #4caf50;
        color: #fff;
        border: none;
        padding: 12px 24px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 20px;
        cursor: pointer;
        text-transform: uppercase;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        transition: background-color 0.3s ease, transform 0.2s ease;
      }

      .get-started-btn:hover {
        background-color: #45a049;
        transform: scale(1.05);
      }
    </style>
  </head>
  <body>
    <div class="page page1" id="page1">
      <div class="image-container">
        <img
          src="https://cdn.pixabay.com/photo/2016/11/22/23/09/fountain-pen-1851096_1280.jpg"
          alt="Background"
          class="background-image"
        />
        <div class="button-overlay">
          <button class="get-started-btn" onclick="goToLoginSignUp()">
            Get Started
          </button>
        </div>
      </div>
    </div>
    <script>
      function goToLoginSignUp() {
        window.location.href = "{% url 'login_signup' %}";
      }
    </script>
  </body>
</html>
