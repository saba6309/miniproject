<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TRIADbot</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f4f4f4;
        height: 100vh;
      }
      .container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        max-width: 860px; /* Adjust width for mobile */
        height: 100%;
        max-height: 720px; /* Adjust height for mobile */
        background-color: #fff;
        border: 1px solid #ddd;
        box-shadow: 0 4px 6px rgb(248, 247, 247);
        overflow: hidden;
        position: relative;
      }
      .chatbot-window {
        position: relative;
        width: 100%;
        height: 100%;
        background-color: #786f6f9b; /* Dark chat window background */
        border-radius: 10px;
        box-shadow: 0px 4px 10px rgb(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .chatbot-header {
        background-color: #fff; /* White header */
        color: #000;
        padding: 10px;
        text-align: center;
        font-weight: bold;
      }
      .chatbot-body {
        flex: 1;
        padding: 10px;
        overflow-y: auto;
        color: #fff;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .chatbot-footer {
        display: flex;
        padding: 10px;
        background-color: #333;
      }
      .chatbot-footer input {
        flex: 1;
        padding: 10px;
        border: none;
        border-radius: 6px;
        margin-right: 10px;
      }
      .chatbot-footer button {
        padding: 10px;
        background-color: #fff;
        color: #000;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      .chatbot-footer button:hover {
        background-color: #f1f1f1;
      }
      .message {
        margin: 5px 0;
        padding: 10px;
        border-radius: 5px;
        max-width: 80%;
        justify-content: center;
        align-items: center;
      }
      .message.user {
        background-color: #1313145e;
        color: #fff;
        align-self: flex-end;
        margin-right: 10px;
      }
      .message.bot {
        background-color: #251e1eb8;
        color: #fff;
        align-self: flex-start;
        margin-left: 10px;
      }
    </style>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/2.2.9/purify.min.js"
      integrity="sha512-YOUR_INTEGRITY_HASH"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </head>
  <body>
    <!-- Container for the chatbot -->
    <div class="container">
      <div class="chatbot-window" id="chatbotWindow">
        <div class="chatbot-header">TriadBot</div>
        <div class="chatbot-body" id="chatbotBody">
          <!-- Chatbot Messages Appear Here -->
        </div>
        <div class="chatbot-footer">
          <input
            type="text"
            id="userInput"
            placeholder="Type your message..."
          />
          <button onclick="sendMessage()">Send</button>
        </div>
      </div>
    </div>
    <script>
      async function sendMessage() {
        const userInput = document.getElementById("userInput");
        const chatbotBody = document.getElementById("chatbotBody");
        if (userInput.value.trim() !== "") {
          // User message
          const userMessage = document.createElement("div");
          userMessage.classList.add("message", "user");
          userMessage.textContent = userInput.value;
          chatbotBody.appendChild(userMessage);
          const userMessageText = userInput.value;
          userInput.value = ""; // Clear input field // Scroll to the bottom
          chatbotBody.scrollTop = chatbotBody.scrollHeight;
          try {
            const response = await fetch("{% url 'send_message' %}", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": "{{ csrf_token }}",
              },
              body: JSON.stringify({ user_message: userMessageText }),
            });
            const result = await response.json();
            const botMessage = document.createElement("div");
            botMessage.classList.add("message", "bot");
            botMessage.innerHTML = result.response;
            chatbotBody.appendChild(botMessage);
            chatbotBody.scrollTop = chatbotBody.scrollHeight;
          } catch (error) {
            console.error("Error:", error);
          }
        }
      }
      const result = awaitresponse.json();
      const cleanResponse = DOMPurify.sanitize(result.response);
      const botMessage = document.createElement("div");
      botMessage.classList.add("message", "bot");
      botMessage.innerHTML = cleanResponse;
      chatbotBody.appendChild(botMessage);
    </script>
  </body>
</html>
